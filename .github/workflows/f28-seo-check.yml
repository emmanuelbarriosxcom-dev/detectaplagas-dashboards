name: F28 - Monthly SEO check
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f28-seo-check
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref
        with:
          persist-credentials: false
      - name: Validate checker
        run: python3 -m unittest discover -s tools -p 'test_seo_check.py' -v
      - name: Check sitemap URLs
        run: python3 tools/seo_check.py --output reports/f28
      - name: Job summary
        if: always()
        run: |
          if [ -f reports/f28/report.md ]; then
            cat reports/f28/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'F28 did not complete. Review job logs; no clean SEO result can be claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4 ref
        with:
          name: f28-seo-report-${{ github.run_id }}
          path: reports/f28/
          if-no-files-found: error
          retention-days: 90
