name: F28 - Monthly SEO check
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/seo_check.py'
      - 'tools/test_seo_check.py'
      - '.github/workflows/f28-seo-check.yml'
permissions:
  contents: read
concurrency:
  group: f28-seo-check
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified checkout v5 ref; Node 24
        with:
          persist-credentials: false
      - name: Validate checker
        run: python3 -m unittest discover -s tools -p 'test_seo_check.py' -v
      - name: Check sitemap URLs
        run: python3 tools/seo_check.py --output reports/f28
      - name: Job summary
        if: always()
        run: |
          if [ -f reports/f28/report.md ]; then
            cat reports/f28/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'F28 did not complete. Review job logs; no clean SEO result can be claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # verified upload-artifact v7.0.2; Node 24
        with:
          name: f28-seo-report-${{ github.run_id }}
          path: reports/f28/
          if-no-files-found: error
          retention-days: 90
